
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alawiTV - لوحة إدارة المحتوى</title>

<style>
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{margin:0;padding:14px;background:#0e1015;color:#f3f4f6}
.container{max-width:720px;margin:auto;background:#181b22;border:1px solid #2a2f3a;border-radius:14px;padding:16px}
h2{font-size:20px;margin:0 0 16px}
h3{font-size:15px;margin:0 0 12px}
.section{background:#12151b;border:1px solid #292f3b;border-radius:10px;padding:14px;margin-bottom:14px}
.field{margin-bottom:12px}
label{display:block;font-size:13px;margin-bottom:6px;color:#d1d5db}
input,select,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #323846;background:#111318;color:white;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#ef4444}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{cursor:pointer}
.btn{border:0;border-radius:8px;padding:11px;color:#fff;font-weight:bold;font-size:13px}
.blue{background:#2563eb}
.red{background:#dc2626}
.green{background:#16a34a}
.gray{background:#374151}
.full{width:100%;margin-top:8px}
.tagrow,.filters{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.tag{background:#222733;border:1px solid #3b4252;color:white;border-radius:20px;padding:7px 12px}
.tag.active{background:#dc2626}
.card{background:#12151b;border:1px solid #292f3b;border-radius:9px;padding:11px;margin-top:9px}
.cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.meta{font-size:12px;color:#9ca3af;margin-top:5px;word-break:break-word}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.actions button{padding:8px 11px;border:0;border-radius:7px;color:white;font-size:12px}
.status{min-height:22px;margin:10px 0;font-size:13px;line-height:1.6}
textarea{min-height:200px;direction:ltr;text-align:left;font-family:monospace;margin-top:12px}
.hidden{display:none!important}
.hint{font-size:11px;color:#9ca3af;line-height:1.6;margin-top:5px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.container{padding:12px}}
</style>
</head>

<body>
<div class="container">

<h2>🎬 لوحة إدارة alawiTV</h2>

<!-- إعدادات GitHub -->
<div class="section">
<h3>⚙️ إعدادات GitHub</h3>

<div class="grid">
<div class="field">
<label>Owner</label>
<input id="owner" value="alisonecena-ops">
</div>
<div class="field">
<label>Repository</label>
<input id="repo" value="-alawitv-data-v2">
</div>
<div class="field">
<label>ملف البيانات</label>
<input id="file" value="videos.json">
</div>
<div class="field">
<label>Branch</label>
<input id="branch" value="main">
</div>
</div>

<div class="field">
<label>GitHub Token</label>
<input id="token" type="password" placeholder="GitHub Token">
<div class="hint">لا تشارك التوكن. لا تستخدم هذه اللوحة على موقع عام إذا كان التوكن محفوظاً بها.</div>
</div>

<button class="btn blue" onclick="saveConfig()">حفظ الإعدادات</button>
<button class="btn gray" onclick="loadRemote()">🔄 جلب المحتوى من GitHub</button>
</div>

<!-- إضافة المحتوى -->
<div class="section">
<h3>➕ إضافة محتوى</h3>

<div class="field">
<label>الاسم</label>
<input id="title" placeholder="اسم الفيلم أو المسلسل أو القناة">
</div>

<div class="field">
<label>الوصف</label>
<input id="description" placeholder="وصف المحتوى">
</div>

<div class="grid">
<div class="field">
<label>القسم</label>
<select id="category" onchange="categoryChanged()">
<option>أفلام</option>
<option>مسلسلات</option>
<option>قنوات</option>
<option>مصارعة</option>
</select>
</div>

<div class="field hidden" id="promotionBox">
<label>اتحاد المصارعة</label>
<input id="promotion" placeholder="WWE أو AEW">
<div class="tagrow">
<button class="tag" onclick="setPromotion('WWE',this)">WWE</button>
<button class="tag" onclick="setPromotion('AEW',this)">AEW</button>
</div>
</div>
</div>

<div class="field">
<label>رابط الصورة</label>
<input id="image" type="url" placeholder="https://...">
</div>

<div class="field">
<label>رابط الفيديو</label>
<input id="url" type="url" placeholder="https://...">
</div>

<button class="btn gray full" onclick="addLocal()">إضافة للقائمة المؤقتة</button>
<button class="btn red full" onclick="publish()">🚀 نشر على GitHub</button>
</div>

<!-- المحتوى المؤقت -->
<div class="section">
<h3>📋 القائمة المؤقتة</h3>
<div id="localList"></div>
</div>

<!-- إدارة المنشور -->
<div class="section">
<h3>🛠 إدارة المحتوى المنشور</h3>

<button class="btn blue full" onclick="loadRemote()">جلب / تحديث المحتوى</button>

<div class="filters">
<button class="tag active" onclick="setFilter('all',this)">الكل</button>
<button class="tag" onclick="setFilter('أفلام',this)">أفلام</button>
<button class="tag" onclick="setFilter('مسلسلات',this)">مسلسلات</button>
<button class="tag" onclick="setFilter('قنوات',this)">قنوات</button>
<button class="tag" onclick="setFilter('مصارعة',this)">مصارعة</button>
</div>

<input id="search" placeholder="🔎 بحث عن المحتوى..." oninput="renderRemote()">

<div id="remoteList"></div>
</div>

<div id="status" class="status"></div>

<textarea id="json" placeholder="JSON"></textarea>
<button class="btn green full" onclick="copyJSON()">📋 نسخ JSON</button>

</div>

<script>
const KEY="alawitv_admin_config_v2";
let localItems=[];
let remoteItems=[];
let filter="all";
let busy=false;

function el(id){return document.getElementById(id)}

function status(msg,color="#e5e7eb"){
el("status").textContent=msg;
el("status").style.color=color;
}

function config(){
return{
owner:el("owner").value.trim(),
repo:el("repo").value.trim(),
file:el("file").value.trim()||"videos.json",
branch:el("branch").value.trim()||"main",
token:el("token").value.trim()
}
}

function saveConfig(){
localStorage.setItem(KEY,JSON.stringify(config()));
status("تم حفظ الإعدادات محلياً","#86efac");
}

function loadConfig(){
try{
const c=JSON.parse(localStorage.getItem(KEY)||"{}");
if(c.owner)el("owner").value=c.owner;
if(c.repo)el("repo").value=c.repo;
if(c.file)el("file").value=c.file;
if(c.branch)el("branch").value=c.branch;
if(c.token)el("token").value=c.token;
}catch(e){}
}

function categoryChanged(){
el("promotionBox").classList.toggle("hidden",el("category").value!=="مصارعة");
}

function setPromotion(v,b){
el("promotion").value=v;
document.querySelectorAll(".tag").forEach(x=>x.classList.remove("active"));
if(b)b.classList.add("active");
}

function finalCategory(){
let c=el("category").value;
let p=el("promotion").value.trim();
return c==="مصارعة"&&p?`مصارعة - ${p}`:c;
}

function makeEntry(){
let title=el("title").value.trim();
let videoUrl=el("url").value.trim();
if(!title||!videoUrl)return null;

return{
id:String(Date.now())+"_"+Math.random().toString(36).slice(2,7),
title,
description:el("description").value.trim()||title,
videoUrl,
thumbnailUrl:el("image").value.trim(),
category:finalCategory()
};
}

function clearForm(){
["title","description","image","url","promotion"].forEach(x=>el(x).value="");
document.querySelectorAll(".tag").forEach(x=>x.classList.remove("active"));
}

function duplicate(list,item){
return list.some(x=>
String(x.title||"").trim().toLowerCase()===item.title.trim().toLowerCase()&&
String(x.category||"").trim().toLowerCase()===item.category.trim().toLowerCase()
);
}

function addLocal(){
let item=makeEntry();
if(!item){status("أدخل الاسم ورابط الفيديو أولاً","#fca5a5");return}
if(duplicate(localItems,item)||duplicate(remoteItems,item)){
status("هذا المحتوى موجود مسبقاً بنفس الاسم والقسم","#fca5a5");
return;
}
localItems.push(item);
renderLocal();
renderJSON();
clearForm();
status("تمت الإضافة إلى القائمة المؤقتة","#86efac");
}

function renderLocal(){
let box=el("localList");
box.innerHTML="";
if(!localItems.length){
box.innerHTML='<div class="meta">القائمة المؤقتة فارغة.</div>';
return;
}
localItems.forEach((v,i)=>{
let c=document.createElement("div");
c.className="card";
let title=document.createElement("strong");
title.textContent=v.title;
let meta=document.createElement("div");
meta.className="meta";
meta.textContent=v.category;
let del=document.createElement("button");
del.className="btn red";
del.textContent="حذف";
del.onclick=()=>{localItems.splice(i,1);renderLocal();renderJSON()};
c.append(title,meta,del);
box.appendChild(c);
});
}

function renderJSON(){
el("json").value=JSON.stringify({videos:localItems},null,2);
}

function escapeHTML(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c])));
}

function api(){
let c=config();
return{
url:`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.file.split("/").map(encodeURIComponent).join("/")}`,
headers:{
"Authorization":"Bearer "+c.token,
"Accept":"application/vnd.github+json",
"Content-Type":"application/json"
},
branch:c.branch
};
}

function b64decode(s){
let bin=atob(s.replace(/\n/g,""));
let bytes=Uint8Array.from(bin,x=>x.charCodeAt(0));
return new TextDecoder().decode(bytes);
}

function b64encode(s){
let bytes=new TextEncoder().encode(s);
let bin="";
bytes.forEach(b=>bin+=String.fromCharCode(b));
return btoa(bin);
}

function extract(obj){
if(Array.isArray(obj))return obj;
if(Array.isArray(obj?.videos))return obj.videos;
return[];
}

async function readRemote(){
let a=api();
let res=await fetch(a.url+"?ref="+encodeURIComponent(a.branch),{headers:a.headers});
if(res.status===404)return{...a,videos:[],sha:null};
if(!res.ok)throw Error("فشل جلب الملف: "+res.status);
let f=await res.json();
let parsed=JSON.parse(b64decode(f.content||""));
return{...a,videos:extract(parsed),sha:f.sha};
}

async function loadRemote(){
if(busy)return;
busy=true;
status("جاري جلب البيانات من GitHub...","#93c5fd");
try{
let d=await readRemote();
remoteItems=d.videos;
renderRemote();
renderJSONRemote();
status("تم جلب "+remoteItems.length+" عنصر بنجاح","#86efac");
}catch(e){status("خطأ: "+e.message,"#fca5a5")}
finally{busy=false}
}

function renderJSONRemote(){
el("json").value=JSON.stringify({videos:remoteItems},null,2);
}

function renderRemote(){
let box=el("remoteList");
box.innerHTML="";
let q=el("search").value.trim().toLowerCase();

let list=remoteItems.map((v,i)=>({v,i})).filter(x=>{
let cat=String(x.v.category||"");
let title=String(x.v.title||"").toLowerCase();
let matchesFilter=filter==="all"||cat.includes(filter);
return matchesFilter&&(title.includes(q)||cat.toLowerCase().includes(q));
});

if(!list.length){
box.innerHTML='<div class="meta">ماكو محتوى مطابق.</div>';
return;
}

list.forEach(({v,i})=>{
let card=document.createElement("div");
card.className="card";

let title=document.createElement("strong");
title.textContent=v.title||"بدون اسم";

let meta=document.createElement("div");
meta.className="meta";
meta.textContent=(v.category||"غير مصنف")+" | ID: "+(v.id||"بدون ID");

let actions=document.createElement("div");
actions.className="actions";

let edit=document.createElement("button");
edit.className="blue";
edit.textContent="✏️ تعديل كامل";
edit.onclick=()=>editRemote(i);

let del=document.createElement("button");
del.className="red";
del.textContent="🗑 حذف";
del.onclick=()=>deleteRemote(i);

actions.append(edit,del);
card.append(title,meta,actions);
box.appendChild(card);
});
}

function setFilter(f,b){
filter=f;
document.querySelectorAll(".filters .tag").forEach(x=>x.classList.remove("active"));
if(b)b.classList.add("active");
renderRemote();
}

async function writeRemote(videos,message,sha){
let a=api();
let body={
message,
content:b64encode(JSON.stringify({videos},null,2)+"\n"),
branch:a.branch
};
if(sha)body.sha=sha;

let res=await fetch(a.url,{
method:"PUT",
headers:a.headers,
body:JSON.stringify(body)
});
if(!res.ok){
let err=await res.json().catch(()=>({}));
throw Error(err.message||"فشل الحفظ "+res.status);
}
}

async function publish(){
if(busy)return;
let c=config();
if(!c.owner||!c.repo||!c.token){
status("أدخل إعدادات GitHub واحفظها أولاً","#fca5a5");
return;
}

let pending=[...localItems];
let formTitle=el("title").value.trim();
let formUrl=el("url").value.trim();

if(formTitle||formUrl){
let x=makeEntry();
if(!x){status("أدخل الاسم ورابط الفيديو","#fca5a5");return}
pending.push(x);
}

if(!pending.length){status("أضف محتوى قبل النشر","#fca5a5");return}

busy=true;
status("جاري النشر...","#93c5fd");

try{
let d=await readRemote();
let combined=[...d.videos];

for(let x of pending){
if(duplicate(combined,x)){
throw Error("محتوى مكرر: "+x.title+" ("+x.category+")");
}
combined.push(x);
}

await writeRemote(combined,"Publish content to alawiTV",d.sha);
remoteItems=combined;
localItems=[];
renderLocal();
renderRemote();
renderJSONRemote();
clearForm();
status("تم النشر بنجاح. عدد المحتويات: "+combined.length,"#86efac");
}catch(e){status("فشل النشر: "+e.message,"#fca5a5")}
finally{busy=false}
}

async function editRemote(index){
if(busy)return;
let item=remoteItems[index];
if(!item)return;

let title=prompt("اسم المحتوى:",item.title||"");
if(title===null)return;
title=title.trim();
if(!title){alert("الاسم مطلوب");return}

let description=prompt("الوصف:",item.description||"");
if(description===null)return;

let category=prompt("القسم:",item.category||"أفلام");
if(category===null)return;

let thumbnailUrl=prompt("رابط الصورة:",item.thumbnailUrl||item.imageUrl||"");
if(thumbnailUrl===null)return;

let videoUrl=prompt("رابط الفيديو:",item.videoUrl||"");
if(videoUrl===null)return;
videoUrl=videoUrl.trim();
if(!videoUrl){alert("رابط الفيديو مطلوب");return}

if(remoteItems.some((x,i)=>i!==index&&
String(x.title||"").toLowerCase()===title.toLowerCase()&&
String(x.category||"").toLowerCase()===category.toLowerCase())){
alert("يوجد محتوى آخر بنفس الاسم والقسم");
return;
}

busy=true;
status("جاري حفظ التعديلات...","#93c5fd");

try{
let d=await readRemote();
let target=d.videos.findIndex(x=>String(x.id)===String(item.id));
if(target===-1){
target=d.videos.findIndex(x=>x.title===item.title&&x.category===item.category);
}
if(target===-1)throw Error("لم يتم العثور على المحتوى في GitHub");

d.videos[target]={
...d.videos[target],
title,
description,
category,
thumbnailUrl,
videoUrl
};

await writeRemote(d.videos,"Edit content in alawiTV",d.sha);
remoteItems=d.videos;
renderRemote();
renderJSONRemote();
status("تم تعديل المحتوى وحفظه بنجاح","#86efac");
}catch(e){status("خطأ أثناء التعديل: "+e.message,"#fca5a5")}
finally{busy=false}
}

async function deleteRemote(index){
if(busy)return;
let item=remoteItems[index];
if(!item)return;

if(!confirm("هل أنت متأكد من حذف:\n"+item.title+"\n\nهذا الحذف سيؤثر على ملف GitHub."))return;

busy=true;
status("جاري حذف المحتوى...","#93c5fd");

try{
let d=await readRemote();
let target=d.videos.findIndex(x=>String(x.id)===String(item.id));
if(target===-1)target=d.videos.findIndex(x=>x.title===item.title&&x.category===item.category);
if(target===-1)throw Error("لم يتم العثور على المحتوى");

d.videos.splice(target,1);
await writeRemote(d.videos,"Delete content from alawiTV",d.sha);

remoteItems=d.videos;
renderRemote();
renderJSONRemote();
status("تم حذف المحتوى بنجاح","#86efac");
}catch(e){status("فشل الحذف: "+e.message,"#fca5a5")}
finally{busy=false}
}

async function copyJSON(){
let text=el("json").value;
if(!text){status("ماكو JSON لنسخه","#fca5a5");return}
try{
await navigator.clipboard.writeText(text);
status("تم نسخ JSON","#86efac");
}catch(e){
el("json").select();
document.execCommand("copy");
status("تم النسخ","#86efac");
}
}

loadConfig();
renderLocal();
categoryChanged();
</script>
</body>
</html>
