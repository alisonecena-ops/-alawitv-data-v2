<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة النشر المباشر - alawiTV</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body {
      margin: 0;
      padding: 16px;
      background: #0f1115;
      color: #f3f4f6;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: #181b22;
      border: 1px solid #2a2f3a;
      border-radius: 12px;
      padding: 18px;
    }
    h2 {
      margin: 0 0 16px;
      font-size: 20px;
      color: #ffffff;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #e5e7eb;
    }
    .settings-box {
      background: #12151b;
      border: 1px solid #292f3b;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 18px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 560px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #d1d5db;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #323846;
      background: #111318;
      color: #ffffff;
      font-size: 14px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #ef4444;
    }
    .quick-tags {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .tag-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid #3b4252;
      background: #222733;
      color: #e5e7eb;
      font-size: 12px;
      cursor: pointer;
    }
    .tag-btn.active {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
    }
    .btn-save-cfg {
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-add {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #374151;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-publish {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #dc2626;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-publish:disabled, .btn-save-link:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-edit-links {
      width: 100%;
      padding: 11px;
      border: 1px solid #3b4252;
      border-radius: 8px;
      background: #1f2430;
      color: #f3f4f6;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-copy {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .items-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #12151b;
      border: 1px solid #292f3b;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .item-meta {
      color: #9ca3af;
      font-size: 12px;
      margin-top: 3px;
      word-break: break-all;
    }
    .btn-del {
      background: #374151;
      color: #fca5a5;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .links-manager {
      margin-top: 14px;
      background: #12151b;
      border: 1px solid #292f3b;
      border-radius: 10px;
      padding: 14px;
    }
    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #323846;
      background: #1b202b;
      color: #e5e7eb;
      font-size: 12px;
      cursor: pointer;
    }
    .filter-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }
    .link-edit-card {
      background: #181b22;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .link-edit-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }
    .btn-save-link {
      padding: 8px 14px;
      border: none;
      border-radius: 7px;
      background: #16a34a;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-reload-links {
      padding: 7px 12px;
      border: 1px solid #3b4252;
      border-radius: 7px;
      background: #222733;
      color: #e5e7eb;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    textarea {
      min-height: 220px;
      margin-top: 14px;
      direction: ltr;
      text-align: left;
      font-family: monospace;
      font-size: 12px;
    }
    .hidden { display: none; }
    .status {
      margin-top: 10px;
      font-size: 13px;
      min-height: 20px;
      line-height: 1.5;
    }
    .hint {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>لوحة النشر المباشر (alawiTV)</h2>

    <div class="settings-box">
      <h3>إعدادات الربط مع GitHub (تُحفظ محلياً في المتصفح)</h3>
      <div class="grid-2">
        <div class="field">
          <label for="ghOwner">اسم المستخدم (Owner):</label>
          <input id="ghOwner" type="text" value="alisonecena-ops" placeholder="مثال: alisonecena-ops" />
        </div>
        <div class="field">
          <label for="ghRepo">اسم المستودع (Repo):</label>
          <input id="ghRepo" type="text" value="-alawitv-data-v2" placeholder="مثال: -alawitv-data-v2" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="ghFile">مسار ملف البيانات (File Path):</label>
          <input id="ghFile" type="text" value="videos.json" placeholder="videos.json" />
        </div>
        <div class="field">
          <label for="ghBranch">الفرع (Branch):</label>
          <input id="ghBranch" type="text" value="main" placeholder="main" />
        </div>
      </div>
      <div class="field">
        <label for="ghToken">GitHub Token (بصلاحية Contents: Read & Write):</label>
        <input id="ghToken" type="password" placeholder="github_pat_..." />
        <div class="hint">لا تشارك التوكن مع أي شخص، ويُستخدم فقط لرفع التحديث مباشرة إلى ملف البيانات.</div>
      </div>
      <button type="button" class="btn-save-cfg" onclick="saveConfig()">حفظ إعدادات الربط</button>
    </div>

    <div class="field">
      <label for="title">الاسم (فيلم، مسلسل، قناة، أو عرض مصارعة):</label>
      <input id="title" type="text" placeholder="مثال: Spider-Man أو AEW Dynamite" />
    </div>

    <div class="field">
      <label for="description">الوصف (اختياري):</label>
      <input id="description" type="text" placeholder="مثال: فيلم سبايدرمان عبر علاوي TV" />
    </div>

    <div class="field">
      <label for="category">نوع المحتوى:</label>
      <select id="category" onchange="handleCategoryChange()">
        <option value="أفلام">أفلام</option>
        <option value="مسلسلات">مسلسلات</option>
        <option value="قنوات">قنوات</option>
        <option value="مصارعة">مصارعة</option>
      </select>
    </div>

    <div class="field hidden" id="wrestlingSection">
      <label for="promotion">قسم المصارعة (WWE / AEW):</label>
      <input id="promotion" type="text" placeholder="مثال: WWE أو AEW" />
      <div class="quick-tags">
        <button type="button" class="tag-btn" onclick="setPromotion('WWE', this)">WWE</button>
        <button type="button" class="tag-btn" onclick="setPromotion('AEW', this)">AEW</button>
      </div>
    </div>

    <div class="field">
      <label for="thumbnailUrl">رابط الصورة (اختياري):</label>
      <input id="thumbnailUrl" type="url" placeholder="https://..." />
    </div>

    <div class="field">
      <label for="videoUrl">رابط الفيديو (.mp4 أو .m3u8):</label>
      <input id="videoUrl" type="url" placeholder="https://..." />
    </div>

    <button type="button" class="btn-add" onclick="addToLocalList()">+ إضافة للقائمة المؤقتة</button>
    <button type="button" class="btn-publish" id="publishBtn" onclick="publishDirectly()">🚀 نشر مباشرة إلى GitHub</button>
    <button type="button" class="btn-edit-links" onclick="toggleLinkManager()">🔧 تعديل روابط (أفلام ومسلسلات)</button>

    <div class="links-manager hidden" id="linkManagerSection">
      <h3>تعديل واستبدال روابط الأفلام والمسلسلات</h3>
      <button type="button" class="btn-reload-links" onclick="loadRemoteLinksForEdit(true)">🔄 جلب أحدث الروابط من GitHub</button>

      <div class="filter-row">
        <button type="button" class="filter-btn active" id="filter-all" onclick="setLinkFilter('all', this)">الكل</button>
        <button type="button" class="filter-btn" id="filter-movies" onclick="setLinkFilter('movies', this)">أفلام</button>
        <button type="button" class="filter-btn" id="filter-series" onclick="setLinkFilter('series', this)">مسلسلات</button>
      </div>

      <div class="field">
        <input id="linkSearchInput" type="text" placeholder="ابحث باسم الفيلم أو المسلسل..." oninput="renderEditableLinks()" />
      </div>

      <div id="editableLinksContainer">
        <div class="item-meta">اضغط «تعديل روابط» أو «جلب أحدث الروابط من GitHub» لعرض العناصر.</div>
      </div>
    </div>

    <div class="status" id="statusMsg"></div>

    <div class="items-list" id="itemsList"></div>

    <textarea id="jsonOutput" placeholder="هنا سيظهر كود JSON..."></textarea>
    <button type="button" class="btn-copy" onclick="copyJson()">📋 نسخ كود JSON</button>
  </div>

  <script>
    const CONFIG_KEY = "alawitv_gh_publish_config_v1";
    const items = [];
    let remoteVideosCache = [];
    let currentLinkFilter = "all";

    function loadConfig() {
      try {
        const raw = localStorage.getItem(CONFIG_KEY);
        if (!raw) return;
        const cfg = JSON.parse(raw);
        if (cfg.owner) document.getElementById("ghOwner").value = cfg.owner;
        if (cfg.repo) document.getElementById("ghRepo").value = cfg.repo;
        if (cfg.file) document.getElementById("ghFile").value = cfg.file;
        if (cfg.branch) document.getElementById("ghBranch").value = cfg.branch;
        if (cfg.token) document.getElementById("ghToken").value = cfg.token;
      } catch (_) {}
    }

    function saveConfig() {
      const cfg = {
        owner: document.getElementById("ghOwner").value.trim(),
        repo: document.getElementById("ghRepo").value.trim(),
        file: document.getElementById("ghFile").value.trim() || "videos.json",
        branch: document.getElementById("ghBranch").value.trim() || "main",
        token: document.getElementById("ghToken").value.trim()
      };
      localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
      setStatus("تم حفظ إعدادات الربط في المتصفح.", "#86efac");
    }

    function getConfig() {
      return {
        owner: document.getElementById("ghOwner").value.trim(),
        repo: document.getElementById("ghRepo").value.trim(),
        file: (document.getElementById("ghFile").value.trim() || "videos.json").replace(/^\/+/, ""),
        branch: document.getElementById("ghBranch").value.trim() || "main",
        token: document.getElementById("ghToken").value.trim()
      };
    }

    function setStatus(msg, color = "#e5e7eb") {
      const el = document.getElementById("statusMsg");
      el.style.color = color;
      el.textContent = msg;
    }

    function handleCategoryChange() {
      const cat = document.getElementById("category").value;
      const section = document.getElementById("wrestlingSection");
      if (cat === "مصارعة") {
        section.classList.remove("hidden");
      } else {
        section.classList.add("hidden");
        document.getElementById("promotion").value = "";
        document.querySelectorAll(".tag-btn").forEach(b => b.classList.remove("active"));
      }
    }

    function setPromotion(name, btn) {
      document.getElementById("promotion").value = name;
      document.querySelectorAll(".tag-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
    }

    function buildEntryFromForm() {
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const category = document.getElementById("category").value;
      const promotion = document.getElementById("promotion").value.trim();
      const thumbnailUrl = document.getElementById("thumbnailUrl").value.trim();
      const videoUrl = document.getElementById("videoUrl").value.trim();

      if (!title || !videoUrl) {
        return { error: "يرجى إدخال الاسم ورابط الفيديو على الأقل." };
      }

      const finalCategory = category === "مصارعة" && promotion
        ? `مصارعة - ${promotion}`
        : category;

      return {
        entry: {
          id: String(Date.now()),
          title,
          description: description || `${title} عبر علاوي TV`,
          videoUrl,
          thumbnailUrl,
          category: finalCategory
        }
      };
    }

    function clearFormInputs() {
      document.getElementById("title").value = "";
      document.getElementById("description").value = "";
      document.getElementById("thumbnailUrl").value = "";
      document.getElementById("videoUrl").value = "";
      document.getElementById("promotion").value = "";
      document.querySelectorAll(".tag-btn").forEach(b => b.classList.remove("active"));
    }

    function addToLocalList() {
      const res = buildEntryFromForm();
      if (res.error) {
        setStatus(res.error, "#fca5a5");
        return;
      }
      items.push(res.entry);
      renderAll();
      clearFormInputs();
      setStatus("تمت الإضافة إلى القائمة المؤقتة.", "#86efac");
      if (!document.getElementById("linkManagerSection").classList.contains("hidden")) {
        renderEditableLinks();
      }
    }

    function removeItem(index) {
      items.splice(index, 1);
      renderAll();
      if (!document.getElementById("linkManagerSection").classList.contains("hidden")) {
        renderEditableLinks();
      }
    }

    function renderAll() {
      const listEl = document.getElementById("itemsList");
      listEl.innerHTML = "";

      items.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <div>
            <strong>${item.title}</strong>
            <div class="item-meta">القسم: ${item.category} | ID: ${item.id}</div>
          </div>
          <button type="button" class="btn-del" onclick="removeItem(${idx})">حذف</button>
        `;
        listEl.appendChild(card);
      });

      document.getElementById("jsonOutput").value = JSON.stringify({ videos: items }, null, 2);
    }

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) {
        bin += String.fromCharCode(bytes[i]);
      }
      return btoa(bin);
    }

    function base64ToUtf8(b64) {
      const clean = b64.replace(/\n/g, "");
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function extractExistingVideos(parsedJson) {
      if (parsedJson && Array.isArray(parsedJson.videos)) {
        return parsedJson.videos;
      }
      if (Array.isArray(parsedJson)) {
        return parsedJson;
      }
      return [];
    }

    async function fetchRemoteVideosFile(cfg) {
      const apiUrl = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.file}`;
      const headers = {
        "Authorization": `Bearer ${cfg.token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      };

      const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(cfg.branch)}`, { headers });
      if (getRes.status === 200) {
        const fileJson = await getRes.json();
        let existingVideos = [];
        const decoded = base64ToUtf8(fileJson.content || "");
        if (decoded.trim()) {
          const parsed = JSON.parse(decoded);
          existingVideos = extractExistingVideos(parsed);
        }
        return { apiUrl, headers, videos: existingVideos, sha: fileJson.sha };
      } else if (getRes.status === 404) {
        return { apiUrl, headers, videos: [], sha: null };
      } else {
        const errText = await getRes.text();
        throw new Error(`تعذر قراءة الملف (${getRes.status}): ${errText}`);
      }
    }

    function toggleLinkManager() {
      const box = document.getElementById("linkManagerSection");
      const willOpen = box.classList.contains("hidden");
      box.classList.toggle("hidden");
      if (willOpen) {
        renderEditableLinks();
        const cfg = getConfig();
        if (cfg.owner && cfg.repo && cfg.token && remoteVideosCache.length === 0) {
          loadRemoteLinksForEdit(false);
        }
      }
    }

    function setLinkFilter(filterName, btn) {
      currentLinkFilter = filterName;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      renderEditableLinks();
    }

    async function loadRemoteLinksForEdit(showMessage = true) {
      const cfg = getConfig();
      if (!cfg.owner || !cfg.repo || !cfg.token) {
        if (showMessage) {
          setStatus("أدخل اسم المستخدم، اسم المستودع، و GitHub Token أولاً لجلب الروابط من GitHub.", "#fca5a5");
        }
        renderEditableLinks();
        return;
      }

      if (showMessage) {
        setStatus("جاري جلب الروابط الحالية من GitHub...", "#93c5fd");
      }

      try {
        const data = await fetchRemoteVideosFile(cfg);
        remoteVideosCache = data.videos;
        renderEditableLinks();
        if (showMessage) {
          setStatus(`تم جلب ${remoteVideosCache.length} عنصر من ${cfg.file}.`, "#86efac");
        }
      } catch (err) {
        setStatus(`خطأ أثناء جلب الروابط: ${err.message}`, "#fca5a5");
        renderEditableLinks();
      }
    }

    function matchesCategoryFilter(category) {
      const cat = String(category || "").trim();
      if (currentLinkFilter === "movies") {
        return cat === "أفلام" || cat.toLowerCase().includes("movie") || cat.toLowerCase().includes("film");
      }
      if (currentLinkFilter === "series") {
        return cat === "مسلسلات" || cat.toLowerCase().includes("series") || cat.toLowerCase().includes("show");
      }
      return true;
    }

    function renderEditableLinks() {
      const container = document.getElementById("editableLinksContainer");
      const search = (document.getElementById("linkSearchInput")?.value || "").trim().toLowerCase();
      container.innerHTML = "";

      const combined = [
        ...remoteVideosCache.map((v, idx) => ({ source: "remote", index: idx, item: v })),
        ...items.map((v, idx) => ({ source: "local", index: idx, item: v }))
      ].filter(entry => {
        if (!matchesCategoryFilter(entry.item.category)) return false;
        if (!search) return true;
        const title = String(entry.item.title || "").toLowerCase();
        const cat = String(entry.item.category || "").toLowerCase();
        return title.includes(search) || cat.includes(search);
      });

      if (combined.length === 0) {
        container.innerHTML = `<div class="item-meta">لا توجد أفلام أو مسلسلات مطابقة للفلتر أو البحث الحالي.</div>`;
        return;
      }

      combined.forEach((entry, i) => {
        const card = document.createElement("div");
        card.className = "link-edit-card";
        const srcLabel = entry.source === "remote" ? "منشور في GitHub" : "في القائمة المؤقتة";
        const inputId = `edit-url-input-${i}`;

        card.innerHTML = `
          <div><strong>${entry.item.title || "بدون اسم"}</strong></div>
          <div class="item-meta">القسم: ${entry.item.category || "غير محدد"} | ${srcLabel}</div>
          <div class="link-edit-actions">
            <input id="${inputId}" type="url" value="${escapeHtmlAttr(entry.item.videoUrl || "")}" placeholder="الصق الرابط الجديد هنا..." />
            <button type="button" class="btn-save-link" id="save-btn-${i}">حفظ الرابط</button>
          </div>
        `;

        container.appendChild(card);

        document.getElementById(`save-btn-${i}`).addEventListener("click", () => {
          const newUrl = document.getElementById(inputId).value.trim();
          saveSingleLinkUpdate(entry.source, entry.index, newUrl, document.getElementById(`save-btn-${i}`));
        });
      });
    }

    function escapeHtmlAttr(val) {
      return String(val)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    async function saveSingleLinkUpdate(source, index, newUrl, btnEl) {
      if (!newUrl) {
        setStatus("أدخل رابط الفيديو الجديد قبل الحفظ.", "#fca5a5");
        return;
      }

      if (source === "local") {
        if (items[index]) {
          items[index].videoUrl = newUrl;
          renderAll();
          renderEditableLinks();
          setStatus(`تم تحديث رابط «${items[index].title}» في القائمة المؤقتة.`, "#86efac");
        }
        return;
      }

      const cfg = getConfig();
      if (!cfg.owner || !cfg.repo || !cfg.token) {
        setStatus("أدخل اسم المستخدم، اسم المستودع، و GitHub Token أولاً لحفظ الرابط على GitHub.", "#fca5a5");
        return;
      }

      if (btnEl) btnEl.disabled = true;
      setStatus("جاري حفظ الرابط الجديد على GitHub...", "#93c5fd");

      try {
        const freshData = await fetchRemoteVideosFile(cfg);
        const list = [...freshData.videos];
        const targetTitle = remoteVideosCache[index]?.title || list[index]?.title || "";

        let targetIdx = index;
        if (targetTitle && (!list[targetIdx] || list[targetIdx].title !== targetTitle)) {
          const found = list.findIndex(x => x.title === targetTitle);
          if (found !== -1) targetIdx = found;
        }

        if (!list[targetIdx]) {
          throw new Error("لم يتم العثور على العنصر في ملف البيانات.");
        }

        list[targetIdx] = {
          ...list[targetIdx],
          videoUrl: newUrl
        };

        const finalJsonObj = { videos: list };
        const formattedJson = JSON.stringify(finalJsonObj, null, 2) + "\n";

        const putBody = {
          message: `Update video link for ${list[targetIdx].title || "item"} in videos.json`,
          content: utf8ToBase64(formattedJson),
          branch: cfg.branch,
          ...(freshData.sha ? { sha: freshData.sha } : {})
        };

        const putRes = await fetch(freshData.apiUrl, {
          method: "PUT",
          headers: freshData.headers,
          body: JSON.stringify(putBody)
        });

        if (!putRes.ok) {
          const errJson = await putRes.json().catch(() => ({}));
          throw new Error(errJson.message || `فشل حفظ الرابط (${putRes.status})`);
        }

        remoteVideosCache = list;
        document.getElementById("jsonOutput").value = JSON.stringify(finalJsonObj, null, 2);
        renderEditableLinks();
        setStatus(`تم استبدال وحفظ رابط «${list[targetIdx].title}» بنجاح في ${cfg.file}!`, "#86efac");
      } catch (err) {
        setStatus(`خطأ أثناء حفظ الرابط: ${err.message}`, "#fca5a5");
      } finally {
        if (btnEl) btnEl.disabled = false;
      }
    }

    async function publishDirectly() {
      const cfg = getConfig();
      if (!cfg.owner || !cfg.repo || !cfg.token) {
        setStatus("أدخل اسم المستخدم، اسم المستودع، و GitHub Token أولاً ثم اضغط حفظ إعدادات الربط.", "#fca5a5");
        return;
      }

      const formTitle = document.getElementById("title").value.trim();
      const formUrl = document.getElementById("videoUrl").value.trim();
      let newEntries = [...items];

      if (formTitle || formUrl) {
        const res = buildEntryFromForm();
        if (res.error) {
          setStatus(res.error, "#fca5a5");
          return;
        }
        newEntries.push(res.entry);
      }

      if (newEntries.length === 0) {
        setStatus("أضف عنصراً واحداً على الأقل قبل النشر.", "#fca5a5");
        return;
      }

      const publishBtn = document.getElementById("publishBtn");
      publishBtn.disabled = true;
      setStatus("جاري النشر إلى GitHub...", "#93c5fd");

      try {
        const data = await fetchRemoteVideosFile(cfg);
        const existingVideos = data.videos;

        const finalJsonObj = {
          videos: [...existingVideos, ...newEntries]
        };
        const formattedJson = JSON.stringify(finalJsonObj, null, 2) + "\n";

        const putBody = {
          message: `Add ${newEntries.map(x => x.title).join(", ")} to videos.json`,
          content: utf8ToBase64(formattedJson),
          branch: cfg.branch,
          ...(data.sha ? { sha: data.sha } : {})
        };

        const putRes = await fetch(data.apiUrl, {
          method: "PUT",
          headers: data.headers,
          body: JSON.stringify(putBody)
        });

        if (!putRes.ok) {
          const errJson = await putRes.json().catch(() => ({}));
          throw new Error(errJson.message || `فشل النشر (${putRes.status})`);
        }

        remoteVideosCache = finalJsonObj.videos;
        items.length = 0;
        renderAll();
        clearFormInputs();
        document.getElementById("jsonOutput").value = JSON.stringify(finalJsonObj, null, 2);
        if (!document.getElementById("linkManagerSection").classList.contains("hidden")) {
          renderEditableLinks();
        }
        setStatus(`تم النشر بنجاح إلى ${cfg.file} بنفس هيكل {"videos": [...]}!`, "#86efac");
      } catch (err) {
        setStatus(`خطأ أثناء النشر: ${err.message}`, "#fca5a5");
      } finally {
        publishBtn.disabled = false;
      }
    }

    function copyJson() {
      const box = document.getElementById("jsonOutput");
      if (!box.value.trim()) {
        setStatus("لا يوجد كود JSON لنسخه.", "#fca5a5");
        return;
      }
      box.select();
      navigator.clipboard?.writeText(box.value);
      setStatus("تم نسخ كود JSON إلى الحافظة.", "#86efac");
    }

    loadConfig();
    renderAll();
  </script>
</body>
</html>
