<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم علاوي TV</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }
    h2 { text-align: center; color: #e50914; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      box-sizing: border-box;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-add { background-color: #e50914; color: white; }
    .btn-copy { background-color: #28a745; color: white; }
    .item {
      background: #1e1e1e;
      padding: 10px 15px;
      border-radius: 8px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #333;
    }
    .btn-del {
      background: #dc3545;
      color: white;
      width: auto;
      padding: 6px 12px;
      margin: 0;
      font-size: 13px;
    }
    textarea {
      width: 100%;
      height: 180px;
      margin-top: 15px;
      background: #0d0d0d;
      color: #00ff88;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      direction: ltr;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <h2>🎬 لوحة تحكم علاوي TV</h2>

  <div class="form-group">
    <label>اسم الفيلم أو القناة:</label>
    <input type="text" id="title" placeholder="مثال: Spider-Man">
  </div>

  <div class="form-group">
    <label>رابط الصورة (اختياري):</label>
    <input type="url" id="thumbnailUrl" placeholder="https://example.com/image.jpg">
  </div>

  <div class="form-group">
    <label>رابط الفيديو (.m3u8 أو .mp4):</label>
    <input type="url" id="videoUrl" placeholder="https://...">
  </div>

  <button class="btn-add" onclick="addVideo()">➕ إضافة للقائمة</button>

  <div id="videoList"></div>

  <textarea id="jsonOutput" readonly placeholder="سيظهر كود JSON هنا..."></textarea>
  <button class="btn-copy" onclick="copyJson()">📋 نسخ الكود للـ GitHub</button>

  <script>
    let videos = [];

    function addVideo() {
      const title = document.getElementById('title').value.trim();
      const thumbnailUrl = document.getElementById('thumbnailUrl').value.trim();
      const videoUrl = document.getElementById('videoUrl').value.trim();

      if (!title || !videoUrl) {
        alert("يرجى إدخال اسم الفيلم ورابط الفيديو على الأقل!");
        return;
      }

      videos.push({
        id: String(videos.length + 1),
        title: title,
        description: "مشاهدة ممتعة عبر علاوي TV",
        videoUrl: videoUrl,
        thumbnailUrl: thumbnailUrl,
        category: "أفلام"
      });

      document.getElementById('title').value = '';
      document.getElementById('thumbnailUrl').value = '';
      document.getElementById('videoUrl').value = '';

      updateUI();
    }

    function removeVideo(index) {
      videos.splice(index, 1);
      // إعادة ترقيم الـ id تلقائياً
      videos.forEach((v, i) => v.id = String(i + 1));
      updateUI();
    }

    function updateUI() {
      const list = document.getElementById('videoList');
      list.innerHTML = '';

      videos.forEach((v, index) => {
        list.innerHTML += `
          <div class="item">
            <span>${v.id}. ${v.title}</span>
            <button class="btn-del" onclick="removeVideo(${index})">حذف</button>
          </div>
        `;
      });

      const finalJson = JSON.stringify({ videos: videos }, null, 2);
      document.getElementById('jsonOutput').value = finalJson;
    }

    function copyJson() {
      const output = document.getElementById('jsonOutput');
      if (!output.value) return;
      output.select();
      document.execCommand('copy');
      alert("تم نسخ الكود بنجاح! الصقه الآن في ملف videos.json على GitHub.");
    }
  </script>

</body>
</html>
